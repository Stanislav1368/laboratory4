{% extends 'athletes/base.html' %}

{% block title %}Редактирование спортсмена{% endblock %}

{% block content %}
<h1 class="mb-4">Редактирование: {{ athlete.name }}</h1>

<form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/list/?source=db" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
